<title>Auréa Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : rail de navigation à gauche (barre d’onglets en bas sur mobile), toile centrale aérée où les visuels occupent la place principale. */
:root{
  --bg:#F3F3EF; --surface:#FFFFFF; --surface-2:#EAEAE5; --line:#DCDCD5;
  --ink:#131317; --ink-2:#4F5058; --ink-3:#86878F;
  --accent:#2B44FF; --accent-ink:#FFFFFF; --accent-soft:#E2E6FF;
  --gold:#C98A0E; --ok:#16875A; --danger:#C93A2A;
  --scrim:rgba(19,19,23,.42);
  --shadow:0 1px 2px rgba(19,19,23,.05),0 10px 30px -8px rgba(19,19,23,.12);
  --shadow-lg:0 30px 80px -20px rgba(19,19,23,.35);
  --f-display:"Syne","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D10; --surface:#15161A; --surface-2:#1D1F24; --line:#2A2C33;
    --ink:#F1F1EC; --ink-2:#B3B4BB; --ink-3:#7B7D86;
    --accent:#7084FF; --accent-ink:#0C0D10; --accent-soft:#1B2048;
    --gold:#EDB443; --ok:#3CC48A; --danger:#FF7461;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -10px rgba(0,0,0,.6);
    --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0D10; --surface:#15161A; --surface-2:#1D1F24; --line:#2A2C33;
  --ink:#F1F1EC; --ink-2:#B3B4BB; --ink-3:#7B7D86;
  --accent:#7084FF; --accent-ink:#0C0D10; --accent-soft:#1B2048;
  --gold:#EDB443; --ok:#3CC48A; --danger:#FF7461;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:28px;padding:24px 16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 210deg,#2B44FF,#8A5CFF,#FF8A5C,#FFC24B,#2B44FF);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.credit-mini{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.credit-mini .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.credit-mini strong{font-family:var(--f-mono);font-size:17px;color:var(--ink);font-weight:500}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#8A5CFF);transition:width .6s var(--ease)}
.user{display:flex;align-items:center;gap:10px;padding:6px 8px;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#FF8A5C,#8A5CFF);flex:none}
.user small{display:block;color:var(--ink-3);font-size:12px}
.theme-btn{margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.theme-btn:hover{background:var(--surface-2)}

.topbar{display:none}
.tabbar{display:none}
main{min-width:0}
.view{max-width:1320px;margin:0 auto;padding-block:36px 72px;padding-left:max(clamp(16px,4vw,52px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,52px),env(safe-area-inset-right,0px));animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Shared ---------- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h-sec{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.h-sec h2{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.h-sec p{color:var(--ink-3);font-size:14px;margin-top:4px}
.link{color:var(--ink-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.link:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .15s var(--ease),background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{box-shadow:0 10px 24px -10px var(--ink)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{box-shadow:0 12px 28px -10px var(--accent)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:all .2s var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.video{background:var(--accent-soft);color:var(--accent)}
.scroller{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;margin:0 -2px;scrollbar-width:thin}
.scroller>*{scroll-snap-align:start;flex:none}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface-2);gap:2px}
.seg button{height:34px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);transition:all .2s var(--ease);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.select{position:relative}
.select select{appearance:none;height:36px;padding:0 34px 0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.select::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* ---------- Posters (visuels générés par CSS) ---------- */
.poster{position:relative;container-type:inline-size;aspect-ratio:var(--ar,4/5);width:100%;overflow:hidden;isolation:isolate;color:var(--tx);background:linear-gradient(155deg,var(--c1) 10%,var(--c2) 100%);font-family:var(--f-body);border-radius:inherit}
.p-glow{position:absolute;inset:-20%;background:radial-gradient(circle at 75% 70%,color-mix(in srgb,var(--c3) 45%,transparent),transparent 45%),radial-gradient(circle at 15% 10%,rgba(255,255,255,.18),transparent 40%);z-index:-1;transition:transform 1.2s var(--ease)}
.p-copy{position:absolute;left:7cqw;right:7cqw;top:7cqw;display:flex;flex-direction:column;gap:2.4cqw;z-index:2}
.p-kicker{font-size:3.4cqw;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.p-copy h4{overflow-wrap:break-word;font-family:var(--f-display);font-weight:800;font-size:10.5cqw;line-height:.95;letter-spacing:-.03em;max-width:88%}
.p-copy p{font-size:4cqw;opacity:.85;max-width:75%;line-height:1.3}
.p-price{position:absolute;left:7cqw;bottom:7cqw;z-index:3;background:var(--tx);color:var(--c1);font-weight:800;font-size:6cqw;padding:1.6cqw 4cqw;border-radius:99px;letter-spacing:-.02em;font-family:var(--f-display)}
.p-logo{position:absolute;right:6cqw;bottom:6cqw;z-index:3;width:11cqw;height:11cqw;border-radius:50%;display:grid;place-items:center;font-size:3.6cqw;font-weight:800;background:color-mix(in srgb,var(--tx) 92%,transparent);color:var(--c1);overflow:hidden}
.p-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.p-play{position:absolute;right:5cqw;top:5cqw;z-index:4;display:inline-flex;align-items:center;gap:1.5cqw;padding:1.4cqw 3cqw 1.4cqw 2.4cqw;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;font:600 3.4cqw/1 var(--f-mono);backdrop-filter:blur(6px)}
.p-play svg{width:3.4cqw;height:3.4cqw;fill:#fff;stroke:none}
.p-photo{position:absolute;inset:0;z-index:0}
.p-photo img{width:100%;height:100%;object-fit:cover;display:block}
.p-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 82%,transparent) 0%,transparent 45%,transparent 60%,color-mix(in srgb,var(--c1) 70%,transparent) 100%)}
.has-photo .p-subject{display:none}
.no-copy .p-copy,.no-copy .p-price,.no-copy .p-logo{display:none}

/* Formats */
.poster[data-f="16:9"] .p-copy{right:45cqw;top:5cqw;left:5cqw}
.poster[data-f="16:9"] .p-copy h4{font-size:6.2cqw}
.poster[data-f="16:9"] .p-kicker{font-size:2cqw}
.poster[data-f="16:9"] .p-copy p{font-size:2.3cqw}
.poster[data-f="16:9"] .p-price{font-size:3.6cqw;left:5cqw;bottom:5cqw}
.poster[data-f="16:9"] .p-logo{width:7cqw;height:7cqw;font-size:2.3cqw;right:4cqw;bottom:4cqw}
.poster[data-f="16:9"] .p-subject{transform:scale(.6);transform-origin:80% 80%}
.poster[data-f="16:9"] .p-play{font-size:2.2cqw}
.poster[data-f="9:16"] .p-copy{top:10cqw}
.poster[data-f="9:16"] .p-copy h4{font-size:12cqw}
.st-minimal[data-f="9:16"] .p-copy,.st-edito[data-f="9:16"] .p-copy{top:auto;bottom:24cqw}
.st-minimal[data-f="9:16"] .p-price{top:12cqw}
.poster[data-f="9:16"] .p-price{bottom:12cqw}
.poster[data-f="9:16"] .p-logo{bottom:11cqw}

/* Styles */
.st-luxe .p-copy h4,.st-edito .p-copy h4{font-family:var(--f-serif);font-weight:400;letter-spacing:-.01em;line-height:1}
.st-luxe .p-copy{align-items:center;text-align:center}
.st-luxe .p-copy p,.st-luxe .p-copy h4{max-width:none}
.st-luxe .p-price{background:transparent;color:var(--tx);border:.4cqw solid currentColor;font-family:var(--f-body);font-weight:600}
.st-bold .p-copy h4{text-transform:uppercase;font-size:9.6cqw;max-width:100%}
.st-bold .p-price{font-size:8cqw;transform:rotate(-6deg);bottom:9cqw}
.st-minimal .p-copy{top:auto;bottom:7cqw;right:30cqw}
.st-minimal .p-copy h4{font-size:8.2cqw;font-weight:700}
.st-minimal .p-price{top:7cqw;bottom:auto;background:transparent;color:var(--tx);padding:0;font-size:6.5cqw}
.st-minimal[data-f="16:9"] .p-copy{bottom:5cqw;top:auto}
.st-minimal[data-f="16:9"] .p-price{top:5cqw}
.st-lifestyle .p-price{left:auto;right:7cqw;top:38cqw;bottom:auto;width:21cqw;height:21cqw;display:grid;place-items:center;text-align:center;padding:2cqw;font-size:4.6cqw;line-height:1;transform:rotate(10deg);background:var(--c3);color:var(--c1)}
.st-lifestyle[data-f="16:9"] .p-price{top:auto;bottom:6cqw;right:14cqw;width:13cqw;height:13cqw;font-size:2.8cqw}
.st-edito .p-copy{top:auto;bottom:7cqw}
.st-edito .p-copy::before{content:"";width:12cqw;height:.6cqw;background:currentColor;margin-bottom:2cqw}
.st-edito .p-price{left:auto;right:7cqw;top:7cqw;bottom:auto}
.st-edito .p-logo{top:7cqw;bottom:auto;left:7cqw;right:auto}
.st-edito.has-price .p-logo{display:none}
.st-edito[data-f="16:9"] .p-copy{bottom:5cqw;top:auto}

/* Sujets par secteur */
.p-subject{position:absolute;z-index:1;transition:transform 1s var(--ease)}
.sh-plate .p-subject{width:70cqw;aspect-ratio:1;right:-12cqw;bottom:-10cqw;border-radius:50%;background:radial-gradient(circle,#FBF8F3 0 58%,#E7DFD2 59% 66%,#FBF8F3 67%);box-shadow:0 4cqw 10cqw -2cqw rgba(0,0,0,.45)}
.sh-plate .p-subject::after{content:"";position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55) 0 4%,transparent 12%),radial-gradient(circle at 62% 60%,#5E8C31 0 9%,transparent 10%),radial-gradient(circle at 40% 65%,#E9B949 0 11%,transparent 12%),conic-gradient(from 40deg,#B4442A,#D9783A,#9A3A22,#E0A146,#B4442A);filter:saturate(1.1)}
.sh-car .p-subject{width:82cqw;height:21cqw;right:-6cqw;bottom:16cqw;border-radius:46% 54% 14% 14%/70% 80% 22% 22%;background:linear-gradient(180deg,color-mix(in srgb,var(--c3) 55%,#fff) 0%,var(--c3) 38%,color-mix(in srgb,var(--c3) 55%,#000) 100%);box-shadow:0 7cqw 6cqw -4cqw rgba(0,0,0,.55)}
.sh-car .p-subject::before{content:"";position:absolute;left:24%;right:30%;top:-34%;height:52%;border-radius:60% 70% 0 0/100% 100% 0 0;background:linear-gradient(180deg,#1b2230,#4a5568);border:1.2cqw solid color-mix(in srgb,var(--c3) 75%,#fff);border-bottom:0}
.sh-car .p-subject::after{content:"";position:absolute;left:13%;bottom:-32%;width:15cqw;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c9ccd2 0 28%,#15171c 30% 100%);box-shadow:44cqw 0 0 0 #15171c}
.sh-house .p-subject{width:58cqw;height:52cqw;right:-2cqw;bottom:-2cqw;clip-path:polygon(50% 0,100% 40%,100% 100%,0 100%,0 40%);background:linear-gradient(180deg,color-mix(in srgb,var(--c3) 92%,#fff),color-mix(in srgb,var(--c3) 75%,#000))}
.sh-house .p-subject::after{content:"";position:absolute;left:18%;right:18%;top:50%;bottom:0;background:linear-gradient(90deg,transparent 0 6%,rgba(255,224,150,.95) 6% 36%,transparent 36% 64%,rgba(255,224,150,.8) 64% 94%,transparent 94%) top/100% 40% no-repeat,linear-gradient(90deg,transparent 40%,rgba(0,0,0,.45) 40% 60%,transparent 60%) bottom/100% 50% no-repeat}
.sh-bottle .p-subject{width:24cqw;height:50cqw;right:16cqw;bottom:8cqw;border-radius:5cqw 5cqw 3cqw 3cqw;background:linear-gradient(90deg,color-mix(in srgb,var(--c3) 70%,#000),var(--c3) 30%,color-mix(in srgb,var(--c3) 40%,#fff) 45%,var(--c3) 60%,color-mix(in srgb,var(--c3) 70%,#000));box-shadow:0 6cqw 8cqw -3cqw rgba(0,0,0,.5)}
.sh-bottle .p-subject::before{content:"";position:absolute;left:28%;right:28%;top:-11cqw;height:12cqw;border-radius:1.5cqw 1.5cqw 0 0;background:linear-gradient(90deg,#222,#666 40%,#222)}
.sh-bottle .p-subject::after{content:"";position:absolute;left:14%;right:14%;top:42%;height:22%;border-radius:1cqw;background:color-mix(in srgb,#fff 82%,transparent)}
.sh-arch .p-subject{width:52cqw;height:72cqw;right:-4cqw;bottom:-4cqw;border-radius:26cqw 26cqw 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c3) 75%,#fff),var(--c3))}
.sh-arch .p-subject::after{content:"";position:absolute;left:30%;bottom:0;width:40%;height:78%;border-radius:10cqw 10cqw 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 80%,#000),var(--c1));box-shadow:inset 0 0 0 1cqw color-mix(in srgb,var(--c3) 50%,#000)}
.sh-sun .p-subject{width:100%;height:40%;left:0;bottom:0;background:repeating-linear-gradient(180deg,color-mix(in srgb,var(--c3) 85%,#fff) 0 1.6cqw,var(--c3) 1.6cqw 4cqw)}
.sh-sun .p-subject::before{content:"";position:absolute;right:14cqw;top:-22cqw;width:34cqw;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#FFF4C9,#FFD36B 60%,#FFB347);box-shadow:0 0 14cqw 4cqw rgba(255,210,110,.6);z-index:-1}
.sh-blocks .p-subject{width:22cqw;height:22cqw;right:34cqw;bottom:0;background:var(--c3);border-radius:1.2cqw;box-shadow:23cqw 0 0 color-mix(in srgb,var(--c3) 80%,#000),11.5cqw -23cqw 0 color-mix(in srgb,var(--c3) 70%,#fff),-11.5cqw -1px 0 transparent}
.sh-blocks .p-subject::after{content:"";position:absolute;left:-12cqw;top:-44cqw;width:3cqw;height:80cqw;background:color-mix(in srgb,var(--tx) 60%,transparent);box-shadow:0 0 0 0 transparent;transform-origin:top;border-radius:2cqw}
.sh-blocks .p-subject::before{content:"";position:absolute;left:-12cqw;top:-44cqw;width:50cqw;height:2.4cqw;background:color-mix(in srgb,var(--tx) 60%,transparent);border-radius:2cqw}
.sh-bag .p-subject{width:40cqw;height:42cqw;right:10cqw;bottom:6cqw;border-radius:3cqw 3cqw 7cqw 7cqw;background:linear-gradient(160deg,color-mix(in srgb,var(--c3) 85%,#fff),color-mix(in srgb,var(--c3) 80%,#000));box-shadow:0 6cqw 8cqw -3cqw rgba(0,0,0,.45)}
.sh-bag .p-subject::before{content:"";position:absolute;left:28%;width:44%;height:14cqw;top:-11cqw;border:2.4cqw solid color-mix(in srgb,var(--c3) 60%,#000);border-bottom:0;border-radius:10cqw 10cqw 0 0}
.sh-grid .p-subject{width:48cqw;aspect-ratio:1;right:4cqw;bottom:6cqw;border-radius:4cqw;transform:rotate(-8deg);background:linear-gradient(0deg,var(--c3) 0 0) 16% 80%/12% 30% no-repeat,linear-gradient(0deg,var(--c3) 0 0) 44% 80%/12% 48% no-repeat,linear-gradient(0deg,var(--c3) 0 0) 72% 80%/12% 64% no-repeat,color-mix(in srgb,var(--tx) 92%,transparent);box-shadow:0 6cqw 10cqw -3cqw rgba(0,0,0,.4)}
.sh-grid .p-subject::after{content:"";position:absolute;left:14%;top:14%;width:40%;height:5%;border-radius:2cqw;background:color-mix(in srgb,var(--c1) 70%,transparent)}

/* Vidéo : léger mouvement */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5cqw)}}
@keyframes drift{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.08) translate(-3%,2%)}}
.is-video.animate .p-subject,.tcard:hover .is-video .p-subject,.gcard:hover .is-video .p-subject{animation:floaty 3.2s ease-in-out infinite}
.is-video.animate .p-glow,.tcard:hover .is-video .p-glow{animation:drift 6s ease-in-out infinite}
.tcard:hover .poster:not(.is-video) .p-glow{transform:scale(1.08)}

/* ---------- Accueil ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 0 8px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5.6vw,64px);line-height:1;letter-spacing:-.035em}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent),#8A5CFF 45%,#FF8A5C 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ask{width:min(760px,100%);margin-top:18px;position:relative}
.ask-box{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:box-shadow .3s,border-color .3s}
.ask-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft),var(--shadow)}
.ask-box svg{color:var(--accent)}
.ask-box input{flex:1;min-width:0;border:0;background:transparent;height:48px;font-size:17px;outline:none}
.ask-box input::placeholder{color:var(--ink-3)}
.ask-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.ask-chips .chip{height:32px;font-size:13px}
.paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:40px 0 56px}
.path{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px;min-height:250px;padding:28px;border-radius:var(--r-lg);overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--surface);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.path:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.path h3{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.path p{color:var(--ink-2);max-width:30ch}
.path .go{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--accent)}
.path .go svg{transition:transform .3s var(--ease)}
.path:hover .go svg{transform:translateX(4px)}
.path-copy{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;min-width:0;z-index:1}
.fan{position:relative;width:200px;height:200px;flex:none}
.fan .mini{position:absolute;width:112px;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);transition:transform .5s var(--ease)}
.fan .mini:nth-child(1){left:0;bottom:0;transform:rotate(-10deg)}
.fan .mini:nth-child(2){left:44px;bottom:16px;transform:rotate(-1deg);z-index:2}
.fan .mini:nth-child(3){left:88px;bottom:4px;transform:rotate(9deg)}
.path:hover .fan .mini:nth-child(1){transform:rotate(-16deg) translate(-10px,-4px)}
.path:hover .fan .mini:nth-child(3){transform:rotate(15deg) translate(10px,-4px)}
.studio-teaser{width:220px;flex:none;border-radius:16px;overflow:hidden;background:#0d0f16;color:#e8e9ef;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);font-size:12px}
.studio-teaser .orb{height:120px;background:radial-gradient(circle at 30% 40%,#ff8a5c,transparent 45%),radial-gradient(circle at 70% 60%,#8a5cff,transparent 50%),radial-gradient(circle at 50% 100%,#2b44ff,transparent 60%),#0d0f16;animation:orb 8s ease-in-out infinite alternate}
@keyframes orb{to{filter:hue-rotate(40deg) saturate(1.2)}}
.studio-teaser .tp{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.studio-teaser .tp span{font-family:var(--f-mono);font-size:11px;color:#9ea2b3}
.studio-teaser .tp b{display:inline-flex;align-self:flex-start;padding:4px 10px;border-radius:99px;background:#2B44FF;color:#fff;font-weight:600}

.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:56px;align-items:start}
.tcard{width:var(--cw,236px);cursor:pointer;display:flex;flex-direction:column;gap:12px;outline:none}
.tcard-media{position:relative;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.tcard:hover .tcard-media,.tcard:focus-visible .tcard-media{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.tcard:focus-visible .tcard-media{outline:2px solid var(--accent);outline-offset:3px}
.tcard-cta{position:absolute;left:50%;bottom:16px;z-index:5;transform:translate(-50%,10px);opacity:0;padding:9px 16px;border-radius:99px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:all .3s var(--ease);white-space:nowrap}
.tcard:hover .tcard-cta,.tcard:focus-visible .tcard-cta{opacity:1;transform:translate(-50%,0)}
.tcard-meta{display:flex;justify-content:space-between;align-items:start;gap:10px;padding:0 2px}
.tcard-meta h3{font-size:15px;font-weight:600}
.tcard-meta p{font-size:13px;color:var(--ink-3)}
.uses{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.uses svg{width:14px;height:14px}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.rcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.rcard .thumb{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s var(--ease)}
.rcard:hover .thumb{transform:scale(1.02)}
.rcard b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard small{font-size:12px;color:var(--ink-3)}
.wallet{padding:24px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:20px;position:sticky;top:24px}
.wallet-top{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);transition:--p .6s}
.ring>div{width:78px;height:78px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-family:var(--f-mono);font-size:19px;font-weight:500}
.ring small{font-size:11px;color:var(--ink-3)}
.wallet h3{font-family:var(--f-display);font-size:20px;letter-spacing:-.02em}
.wallet .muted{color:var(--ink-3);font-size:13px}
.usage{display:flex;flex-direction:column;gap:10px;font-size:14px}
.usage div{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2)}
.usage span:last-child{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.plan{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13px;gap:8px}
.plan b{font-weight:700}
.sector-pill{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.sector-pill button{color:var(--accent);font-weight:600}

/* ---------- Templates ---------- */
.page-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-family:var(--f-display);font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.page-head p{color:var(--ink-2);margin-top:8px;max-width:58ch}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);width:min(320px,100%);color:var(--ink-3)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--ink)}
.sectors{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.filters .count{margin-left:auto;font-size:14px;color:var(--ink-3)}
.masonry{columns:4 230px;column-gap:22px}
.masonry .tcard{--cw:100%;break-inside:avoid;margin-bottom:28px;display:flex}
.empty{padding:60px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}

/* ---------- Éditeur ---------- */
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600;font-size:14px;margin-bottom:14px}
.crumb:hover{color:var(--ink)}
.editor{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:28px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:14px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.block-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.block-h h3 .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--ink-2)}
.block-h h3 .n.done{background:var(--ok);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input[type=text],.field textarea,.field select,.inp{width:100%;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
.field textarea{height:auto;padding:12px 14px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:1.5px dashed var(--line);background:var(--bg);cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent);flex:none;box-shadow:var(--shadow)}
.drop b{display:block;font-size:14px}
.drop small{color:var(--ink-3);font-size:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .th{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer}
.thumbs .th[aria-pressed="true"]{border-color:var(--accent)}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:18px;text-align:center}
.suggest{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent)}
.suggest svg{width:16px;height:16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;background:var(--bg)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.swatch .dots{display:flex}
.swatch .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);margin-left:-5px}
.swatch .dots i:first-child{margin-left:0}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.color{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.color input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:none;padding:3px;cursor:pointer}
.fmt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fmt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;transition:all .2s}
.fmt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fmt .shape{border:1.6px solid currentColor;border-radius:3px;flex:none;color:var(--ink-3)}
.fmt[aria-pressed="true"] .shape{color:var(--accent)}
.fmt b{display:block;font-size:13px}
.fmt small{display:block;font-size:11px;color:var(--ink-3);line-height:1.3}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:14px}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.switch{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.toggle input:checked+.switch{background:var(--accent)}
.toggle input:checked+.switch::after{transform:translateX(16px)}
.toggle input:focus-visible+.switch{outline:2px solid var(--accent);outline-offset:2px}
.prompt-box{font-family:var(--f-mono);font-size:12.5px;line-height:1.6}
.hint{font-size:12px;color:var(--ink-3)}
.stage-wrap{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
.stage{border-radius:var(--r-lg);padding:clamp(18px,4vw,48px);display:grid;place-items:center;min-height:min(72vh,720px);background:radial-gradient(circle at 50% 40%,var(--surface) 0,transparent 70%),repeating-conic-gradient(var(--surface-2) 0 25%,transparent 0 50%) 0 0/22px 22px;border:1px solid var(--line);position:relative;overflow:hidden}
.stage .frame{border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg);transition:width .5s var(--ease)}
.stage .frame[data-f="1:1"]{width:min(100%,480px)}
.stage .frame[data-f="4:5"]{width:min(100%,430px)}
.stage .frame[data-f="9:16"]{width:min(100%,340px)}
.stage .frame[data-f="16:9"]{width:min(100%,680px)}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gen-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 14px 14px 20px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.cost{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.cost b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-size:16px}
.cost svg{color:var(--gold)}
.btn-gen{height:50px;padding:0 26px;font-size:16px;background:linear-gradient(100deg,var(--accent),#7A4DFF);color:#fff;position:relative;overflow:hidden}
.btn-gen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);transition:transform .8s var(--ease)}
.btn-gen:hover::after{transform:translateX(100%)}
.btn-gen:hover{box-shadow:0 14px 30px -10px #5a4dff}

/* ---------- Studio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.composer-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.composer textarea{display:block;width:100%;min-height:150px;border:0;background:transparent;resize:vertical;padding:20px 22px;font-size:18px;line-height:1.55;outline:none}
.composer textarea::placeholder{color:var(--ink-3)}
.composer-refs{display:flex;align-items:center;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.ref-add{position:relative;width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);cursor:pointer;transition:all .2s}
.ref-add:hover{border-color:var(--accent);color:var(--accent)}
.ref-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 22px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.btn-magic{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:600;background:var(--accent-soft);color:var(--accent);transition:transform .2s}
.btn-magic:hover{transform:translateY(-1px)}
.btn-magic.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.settings{display:flex;flex-direction:column;gap:12px;position:sticky;top:24px}
.opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:600;color:var(--ink-2);transition:all .2s}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt .shape{border:1.6px solid currentColor;border-radius:3px}
.model{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;width:100%;transition:all .2s}
.model[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.model .dot{width:34px;height:34px;border-radius:10px;flex:none}
.model b{display:block;font-size:14px}
.model small{display:block;font-size:12px;color:var(--ink-3)}
.model .c{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper .ctl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--bg)}
.stepper .ctl button{width:34px;height:34px;font-size:18px;color:var(--ink-2)}
.stepper .ctl span{min-width:24px;text-align:center;font-family:var(--f-mono)}
details.adv summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"+";font-size:20px;color:var(--ink-3);transition:transform .25s}
details.adv[open] summary::after{transform:rotate(45deg)}
details.adv .adv-body{display:flex;flex-direction:column;gap:14px;margin-top:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-h{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.range-h span:last-child{font-family:var(--f-mono)}
.estimate{background:var(--ink);color:var(--bg);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:12px}
.estimate .big{display:flex;align-items:baseline;gap:8px}
.estimate .big b{font-family:var(--f-mono);font-size:30px;font-weight:500}
.estimate .calc{font-family:var(--f-mono);font-size:12px;opacity:.65}
.estimate .btn-gen{width:100%}
.estimate .after{font-size:12px;opacity:.7}
.results{margin-top:36px}
.gen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;align-items:start}
.gcard{border-radius:var(--r-md);overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}

/* ============ Rendu des visuels ============ */
function poster(t,o={}){
  const shape=o.shape||SEC[t.sector].shape;
  const pal=o.pal||t.pal;
  const f=o.format||t.format;
  const c=Object.assign({kicker:t.kicker,headline:t.headline,sub:t.sub,price:t.price,brand:'Maison Laurent'},o.copy||{});
  const photo=o.photo?`<div class="p-photo"><img src="${o.photo}" alt=""></div>`:'';
  const logo=o.logo?`<img src="${o.logo}" alt="">`:esc(initials(c.brand));
  const cls=['poster','st-'+t.style,'sh-'+shape,t.type==='video'?'is-video':'',o.photo?'has-photo':'',o.animate?'animate':'',o.noCopy?'no-copy':'',c.price?'has-price':''].join(' ');
  return `<div class="${cls}" data-f="${f}" style="--ar:${FORMATS[f].ar};--c1:${pal[0]};--c2:${pal[1]};--c3:${pal[2]};--tx:${pal[3]}${o.hue?`;filter:hue-rotate(${o.hue}deg)`:''}">
    <div class="p-glow"></div>${photo}<div class="p-subject"></div>
    <div class="p-copy">${c.kicker?`<span class="p-kicker">${esc(c.kicker)}</span>`:''}<h4>${esc(c.headline)}</h4>${c.sub?`<p>${esc(c.sub)}</p>`:''}</div>
    ${c.price?`<div class="p-price">${esc(c.price)}</div>`:''}
    <div class="p-logo">${logo}</div>
    ${t.type==='video'&&!o.noBadge?`<div class="p-play"><svg viewBox="0 0 24 24">${I.play}</svg>${o.dur||15} s</div>`:''}
  </div>`;
}
function tcard(t,cw){
  return `<article class="tcard" data-tpl="${t.id}" tabindex="0" role="button" aria-label="Personnaliser le template ${esc(t.name)}"${cw?` style="--cw:${cw}"`:''}>
    <div class="tcard-media">${poster(t)}<span class="tcard-cta">Personnaliser</span></div>
    <div class="tcard-meta"><div><h3>${esc(t.name)}</h3><p>${t.type==='video'?'Vidéo':'Image'} · ${STYLES[t.style]} · ${t.format}</p></div><span class="uses" title="Utilisations">${ic('fire')}${fmtK(t.pop)}</span></div>
  </article>`;
}
function fmtShape(f,scale=1){const F=FORMATS[f];return `<span class="shape" style="width:${F.w*scale}px;height:${F.h*scale}px"></span>`}

function route(){
  let id=(location.hash||'#accueil').slice(1);
  if(!['accueil','templates','editeur','studio','academie'].includes(id))id='accueil';
  const navId=id==='editeur'?'templates':id;
  $$('[data-route]').forEach(a=>{if(a.dataset.route===navId)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const v=$('#view');v.style.animation='none';v.offsetHeight;v.style.animation='';
  ({accueil:renderHome,templates:renderTemplates,editeur:renderEditor,studio:renderStudio,academie:renderAcademy})[id]();
  updateCredits();
  window.scrollTo({top:0,behavior:'instant'});
}

function readFiles(files,cb){

}
function dropzone(el,cb){

/* ============ Génération (commune) ============ */
let genBusy=false;
async function runGeneration({cost,kind,visual,frameF,steps,results,onSave}){
  if(genBusy)return;
  if(cost>state.credits){toast(`Crédits insuffisants : il vous manque ${fmtN(cost-state.credits)} crédits. Rechargez depuis votre solde.`,true);return}
  genBusy=true;
  state.credits-=cost;state.usage[kind]=(state.usage[kind]||0)+cost;updateCredits();
  const w={'1:1':300,'4:5':280,'9:16':230,'16:9':400}[frameF];
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="genT" style="width:min(860px,100%)">
    <div class="genbox">
      <div class="gen-visual" id="genVis" style="width:min(100%,${w}px);justify-self:center">${visual}</div>
      <div><span class="eyebrow">${fmtN(cost)} crédits utilisés</span><h2 id="genT" style="margin-top:8px">Création en cours…</h2>
        <ul class="steps">${steps.map(s=>`<li><i></i>${esc(s)}</li>`).join('')}</ul>
      </div>
    </div></div>`,false);
  const lis=$$('.steps li');
  for(let i=0;i<lis.length;i++){lis[i].classList.add('on');await wait(700+Math.random()*500);lis[i].classList.replace('on','done')}
  $('#genVis').classList.add('revealed');await wait(900);
  const res=results();genBusy=false;
  $('#modalRoot .sheet').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:start;gap:12px"><div><span class="eyebrow" style="color:var(--ok)">Terminé</span><h2 style="margin-top:6px">Vos créations sont prêtes</h2><p class="sub">${res.length} visuel${res.length>1?'s':''} généré${res.length>1?'s':''} · ${fmtN(cost)} crédits · solde ${fmtN(state.credits)}</p></div><button class="theme-btn" style="display:grid" data-action="close" aria-label="Fermer">${ic('close')}</button></div>
    <div class="result-grid">${res.map(r=>`<div><div class="frame" style="width:${({'1:1':220,'4:5':200,'9:16':170,'16:9':340})[r.f]}px">${r.html}</div><small>${esc(r.label)}</small></div>`).join('')}</div>
    <div class="sheet-foot"><button class="btn btn-ghost" data-action="close">Modifier encore</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" id="exportBtn">Exporter</button><button class="btn btn-accent" id="saveBtn">${ic('check')} Enregistrer dans mes créations</button></div></div>`;
  $('#saveBtn').addEventListener('click',()=>{onSave();closeModal();toast('Enregistré dans vos créations');});
  $('#exportBtn').addEventListener('click',()=>toast('Export HD en préparation · disponible dans Mes créations'));
}

function detectShape(p){
  const m=[[/burger|pizza|plat|restau|cuisine|caf[ée]|menu|dessert|cocktail/i,'plate'],[/voiture|auto|suv|garage|moto|v[ée]hicule/i,'car'],[/maison|appart|villa|immobili|bien|r[ée]sidence/i,'house'],[/parfum|s[ée]rum|cr[eè]me|cosm[ée]t|beaut|flacon|soin/i,'bottle'],[/robe|mode|veste|manteau|collection|look/i,'arch'],[/plage|voyage|h[ôo]tel|s[ée]jour|vacances|mer|montagne/i,'sun'],[/chantier|btp|travaux|r[ée]nov|b[âa]timent/i,'blocks'],[/boutique|soldes|magasin|shopping|sac|promo/i,'bag']];
  for(const [r,s] of m)if(r.test(p))return s;return 'grid';
}
function genPoster(g,i=0){
  const r=rng(hash(g.prompt)+(+g.seed||0)+i*97),h=Math.floor(r()*360),h2=(h+40+r()*80)%360,h3=(h+180)%360;
  const pal=[`hsl(${h} 45% ${18+r()*20}%)`,`hsl(${h2} 55% ${35+r()*20}%)`,`hsl(${h3} 70% 62%)`,'#fff'];
  const t={sector:'services',style:'minimal',type:g.mode,pal,kicker:'',headline:'',sub:'',price:''};
  return poster(t,{shape:detectShape(g.prompt),format:g.ratio,noCopy:true,dur:g.dur,animate:g.mode==='video'});
}

async function enhance(){
  const s=state.st,b=$('#enhance');if(b.classList.contains('busy'))return;
  const base=(s.prompt.trim()||'Visuel publicitaire pour mon entreprise').replace(/[.\s]+$/,'');
  const shape=detectShape(base);
  const common=s.mode==='image'
    ?['photographie publicitaire professionnelle','éclairage studio doux','profondeur de champ réduite','composition avec espace négatif pour le texte','couleurs riches et fidèles','très haute définition']
    :[`mouvement de caméra ${s.camera==='Automatique'?'en travelling avant lent':s.camera.toLowerCase()}`,'éclairage cinématographique','24 images par seconde','transitions fluides','ambiance premium','plan final stable pour le logo'];
  const out=`${base.charAt(0).toUpperCase()+base.slice(1)}, ${ENH[shape]}, ${common.join(', ')}.`;
  b.classList.add('busy');const ta=$('#stPrompt');ta.value='';
  if(reduce){ta.value=out}else{for(let i=0;i<=out.length;i+=3){ta.value=out.slice(0,i);await new Promise(r=>setTimeout(r,12))}ta.value=out}
  s.prompt=out;$('#charCount').textContent=`${out.length} / 1 500`;b.classList.remove('busy');toast('Prompt enrichi : sujet, décor, lumière et cadrage précisés');
}
async function studioGenerate(){
  const s=state.st;
  if(s.prompt.trim().length<8){toast('Décrivez votre idée en quelques mots (8 caractères minimum).',true);$('#stPrompt').focus();return}
  const cost=stCost();
  if(cost>state.credits){toast(`Crédits insuffisants : il vous manque ${fmtN(cost-state.credits)} crédits. Rechargez depuis votre solde.`,true);return}
  state.credits-=cost;state.usage[s.mode==='video'?'videos':'studio']+=cost;updateCredits();updEstimate();
  const m=MODELS[s.mode].find(x=>x.id===s.model);
  const seed=+s.seed||Math.floor(Math.random()*99999);
  const batch=Array.from({length:s.variations},(_,i)=>({prompt:s.prompt.trim(),mode:s.mode,ratio:s.ratio,model:m.name,seed:seed+i,dur:s.dur,loading:true}));
  s.results=batch.concat(s.results.filter(g=>!g.sample));
  const btn=$('#stGen');btn.disabled=true;btn.innerHTML=`${ic('spark')} Génération…`;
  drawGens();$('#genGrid').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  await wait(s.mode==='video'?3200:2200);
  batch.forEach(g=>g.loading=false);
  if($('#genGrid')){drawGens();const b=$('#stGen');b.disabled=false;b.innerHTML=`${ic('spark')} Générer`}
  toast(`${batch.length} ${s.mode==='video'?'vidéo':'image'}${batch.length>1?'s':''} générée${batch.length>1?'s':''} · ${cost} crédits`);
}

  const m=r.firstElementChild;m.dataset.dismiss=dismissable?'1':'';
  document.body.style.overflow='hidden';
  setTimeout(()=>{const f=m.querySelector('button:not([disabled])');f&&f.focus({preventScroll:true})},50);
}
function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow='';if((location.hash||'').slice(1)==='accueil'||!location.hash)renderHome(),updateCredits()}

/* ============ Événements globaux ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-tpl],[data-action],[data-idea],[data-go-filter],[data-fsec],[data-ftype],[data-mode],[data-model],[data-ratio],[data-res],[data-dur],[data-var],[data-atab],[data-plib],[data-copyp],[data-usep],[data-creation],[data-tuto],[data-guide]');
  if(!el){if(e.target.classList.contains('modal')&&e.target.dataset.dismiss)closeModal();return}
  const d=el.dataset,s=state.st;
  if(d.go){go(d.go);return}
  if(d.tpl){closeModal();openTemplate(d.tpl);return}
  if(d.idea){$('#askInput').value=d.idea;startFromIdea(d.idea);return}
  if(d.goFilter){state.f.sector=d.goFilter;go('templates');return}
  if(d.fsec){state.f.sector=d.fsec;$$('[data-fsec]').forEach(b=>b.setAttribute('aria-pressed',b===el));drawTplGrid();return}
  if(d.ftype){state.f.type=d.ftype;$$('[data-ftype]').forEach(b=>b.setAttribute('aria-pressed',b===el));drawTplGrid();return}
  if(d.creation!==undefined){const c=state.creations[+d.creation];openTemplateSilent(c.tid);Object.assign(state.ed.copy,c.copy);if(c.pal){state.ed.pal=[...c.pal];state.ed.palId='custom'}state.ed.formats=[c.format];state.ed.active=c.format;if(c.photo){state.ed.photo=c.photo;state.ed.photos=[c.photo]}state.ed.logo=c.logo||null;go('editeur');return}
  if(d.mode){if(s.mode!==d.mode){s.mode=d.mode;s.model=MODELS[s.mode][s.mode==='image'?0:1].id;s.res=s.mode==='image'?'2K':'1080p';renderStudio()}return}
  if(d.model){s.model=d.model;$$('[data-model]').forEach(b=>b.setAttribute('aria-pressed',b===el));updEstimate();return}
  if(d.ratio){s.ratio=d.ratio;$$('[data-ratio]').forEach(b=>b.setAttribute('aria-pressed',b===el));return}
  if(d.res){s.res=d.res;$$('[data-res]').forEach(b=>b.setAttribute('aria-pressed',b===el));updEstimate();return}
  if(d.dur){s.dur=+d.dur;$$('[data-dur]').forEach(b=>b.setAttribute('aria-pressed',b===el));updEstimate();return}
  if(d.var){s.variations=Math.max(1,Math.min(4,s.variations+ +d.var));$('#varN').textContent=s.variations;updEstimate();return}
  if(d.atab){state.acadTab=d.atab;$$('[data-atab]').forEach(b=>b.setAttribute('aria-selected',b===el));drawAcademy();return}
  if(d.plib){state.plibSector=d.plib;drawAcademy();return}
  if(d.copyp!==undefined){const p=PROMPTS[+d.copyp][3];const ok=()=>toast('Prompt copié');try{navigator.clipboard.writeText(p).then(ok,()=>toast('Copie impossible ici : sélectionnez le texte du prompt pour le copier.',true))}catch(err){toast('Copie impossible ici : sélectionnez le texte du prompt pour le copier.',true)}return}
  if(d.usep!==undefined){const p=PROMPTS[+d.usep];s.prompt=p[3];s.mode=p[1];s.model=MODELS[s.mode][s.mode==='image'?0:1].id;s.res=s.mode==='image'?'2K':'1080p';go('studio');toast('Prompt chargé dans le Studio Libre');return}
  if(d.tuto){toast(`Lecture : « ${d.tuto} »`);return}
  if(d.guide){toast(`Ouverture du guide « ${d.guide} »`);return}
  if(d.action==='sector'){openSector(false);return}
  if(d.action==='close'){closeModal();return}
  if(d.action==='topup'){state.credits+=500;updateCredits();toast('500 crédits ajoutés à votre solde');return}
  if(d.action==='resetf'){Object.assign(state.f,{sector:'all',type:'all',style:'all',goal:'all',format:'all',q:''});renderTemplates();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const m=$('#modalRoot .modal');if(m&&m.dataset.dismiss&&!genBusy)closeModal()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tcard,.th')){e.preventDefault();e.target.click()}
});

/* ============ Thème ============ */
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;['#themeBtn','#themeBtn2'].forEach(id=>{$(id).innerHTML=ic(dark?'sun':'moon')})}
['#themeBtn','#themeBtn2'].forEach(id=>$(id).addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';store.set('theme',n);applyTheme(n)}));

/* ============ Démarrage ============ */
buildNav();applyTheme(store.get('theme',null));setSectorLabel();
state.f.sector=state.sector||'all';
window.addEventListener('hashchange',route);
route();
if(!state.sector)openSector(true);
</script>
