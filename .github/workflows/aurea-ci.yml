name: Aurea - checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ai-orchestrator-setup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurea-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate prototype
        run: node scripts/check-prototype.mjs
